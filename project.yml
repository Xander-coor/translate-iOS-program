name: Translate
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
targets:
  Translate:
    type: application
    platform: iOS
    sources: [TranslateApp]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.translate
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: 即時翻譯
